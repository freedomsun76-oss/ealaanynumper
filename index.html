<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تجميع الأرقام وحذف المكرر (مزامنة أونلاين)</title>
<style>
/* نفس التنسيق القديم بالظبط */
:root{font-family:Tahoma,Arial,sans-serif;color:#17212b;background:#f3f7fa}
*{box-sizing:border-box}
body{margin:0;padding:22px}
main{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #dbe5ec;border-radius:18px;padding:22px;box-shadow:0 8px 28px #18324710}
h1{font-size:25px;margin:0 0 8px}
label{display:block;font-weight:bold;margin:14px 0 8px}
textarea{width:100%;padding:13px;border:1px solid #cbd7df;border-radius:10px;font:15px/1.7 Consolas,monospace;resize:vertical;direction:ltr;text-align:left}
#input{min-height:100px}
#allBox{min-height:250px;background:#ebf5fb;border-color:#a8d3ec}
button,.filebtn{border:0;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:bold;cursor:pointer;background:#e6f4fb;color:#124a67;margin-bottom:5px; transition: 0.2s;}
button.primary{background:#087eae;color:white}
button.green{background:#27ae60;color:white}
button.danger{background:#fff0ee;color:#a12a20}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:#f2f7fa;border-radius:10px;padding:10px 14px;flex:1;min-width:130px}
.stat b{display:block;font-size:22px;margin-top:4px}
input[type=file]{display:none}
.two-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
@media(max-width:800px){.two-cols{grid-template-columns:1fr}}
.box-title{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.box-title span{font-weight:bold}
.box-title .badge{background:#087eae;color:white;border-radius:20px;padding:2px 10px;font-size:12px}
.batch-container {max-height: 400px;overflow-y: auto;border: 2px dashed #bdc3c7;padding: 10px;border-radius: 10px;background: #fafbfc;margin-top: 10px;}
.batch-btn {width: 100%;text-align: right;background: #ecf0f1;border: 1px solid #bdc3c7;padding: 10px;margin-bottom: 8px;border-radius: 8px;cursor: pointer;font-size: 14px;font-weight: bold;color: #2c3e50;display: flex;justify-content: space-between;}
.batch-btn:hover {background: #d5dbdb;}
.batch-btn.copied {background: #d5f5e3 !important;border-color: #27ae60;color: #145a32;pointer-events: none;}
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.8);display:flex;justify-content:center;align-items:center;z-index:9999;font-size:20px;font-weight:bold;color:#087eae;}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">⏳ جاري الاتصال بقاعدة البيانات... (تأكد من إعداد Firebase)</div>

<main>
  <h1>تجميع الأرقام (+20) - متزامن أونلاين</h1>
  
  <div class="two-cols">
    <div>
        <label for="input">١) الصق مجموعة الأرقام هنا</label>
        <textarea id="input" placeholder="01012345678&#10;01112345678"></textarea>
        <div class="actions">
            <button class="green" id="add">➕ إضافة الأرقام</button>
            <button id="clearInput">🧹 مسح الإدخال</button>
        </div>

        <div class="stats">
            <div class="stat">إجمالي الأرقام<b id="count">0</b></div>
            <div class="stat">جديد في آخر إضافة<b id="added">0</b></div>
            <div class="stat">مكرر تم تجاهله<b id="dupes">0</b></div>
        </div>

        <div class="box-title">
            <span>٢) كل الأرقام المجمعة (مشتركة بين الجميع)</span>
            <span class="badge" id="allCount">0</span>
        </div>
        <textarea id="allBox" readonly></textarea>
        
        <div class="actions" style="margin-top:10px">
            <button class="primary" id="save">💾 تصدير كل الأرقام TXT</button>
            <label class="filebtn" for="file">📂 استيراد ملف TXT</label>
            <input id="file" type="file" accept=".txt,text/plain">
            <button class="danger" id="reset">🗑️ مسح القائمة للجميع</button>
        </div>
    </div>

    <div>
        <div class="box-title">
            <span>✂️ أزرار نسخ الدفعات (25 رقم)</span>
        </div>
        <p style="font-size:13px; color:#555;">الدفعات غير المنسوخة تظهر في الأعلى.</p>
        <div class="batch-container" id="batchContainer"></div>
    </div>
  </div>
</main>

<!-- ربط مكتبات Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ⚠️ هام جداً: استبدل بيانات الكونفيج دي ببيانات مشروعك من Firebase Console
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// تهيئة Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "apps", "shared_numbers_list");

// المتغيرات
const input = document.getElementById("input");
const allBox = document.getElementById("allBox");
const countEl = document.getElementById("count");
const addedEl = document.getElementById("added");
const dupesEl = document.getElementById("dupes");
const allCountEl = document.getElementById("allCount");
const batchContainer = document.getElementById("batchContainer");
const loadingOverlay = document.getElementById("loading");

let numbers = [];
let copiedBatches = new Set(); 
let isSyncing = false; // عشان نمنع حلقة لا نهائية من التحديث

// دالة تنظيف الأرقام وإضافة +20
function parse(text) {
  return text.split(/[\s,،;؛|]+/u).map(part => {
    let western = part
      .replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)))
      .replace(/[۰-۹]/g, d => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
      .replace(/\D/g, "");
    if (!western) return "";
    if (western.startsWith("0020")) western = western.slice(4);
    if (western.startsWith("20") && western.length > 10) western = western.slice(2);
    if (western.startsWith("0")) western = western.slice(1);
    return "+20" + western;
  }).filter(Boolean);
}

// حفظ البيانات في السيرفر
async function saveToCloud() {
    if (isSyncing) return;
    try {
        await setDoc(docRef, {
            numbers: numbers,
            copiedBatches: [...copiedBatches]
        }, { merge: true });
    } catch (e) {
        console.error("Error saving data: ", e);
    }
}

// الاستماع للتغييرات من السيرفر (عشان تظهر عند زميلك فوراً)
onSnapshot(docRef, (docSnap) => {
    loadingOverlay.style.display = "none"; // إخفاء شاشة التحميل
    
    if (docSnap.exists()) {
        const data = docSnap.data();
        isSyncing = true;
        
        // تحديث المتغيرات المحلية بالبيانات الجديدة
        numbers = data.numbers || [];
        copiedBatches = new Set(data.copiedBatches || []);
        
        renderUI();
        
        setTimeout(() => isSyncing = false, 100);
    } else {
        // لو مفيش بيانات، ننشئ مستند جديد
        saveToCloud();
    }
}, (error) => {
    loadingOverlay.textContent = "❌ خطأ في الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.";
    console.error(error);
});

function renderBatches() {
    batchContainer.innerHTML = "";
    if (numbers.length === 0) {
        batchContainer.innerHTML = "<p style='color:#999; text-align:center;'>لا توجد أرقام لإنشاء دفعات.</p>";
        return;
    }

    const batchSize = 25;
    const totalBatches = Math.ceil(numbers.length / batchSize);
    let batchesArray = [];

    for (let i = 0; i < totalBatches; i++) {
        const start = i * batchSize;
        const end = Math.min(start + batchSize, numbers.length);
        batchesArray.push({
            id: i,
            start: start,
            end: end,
            numbers: numbers.slice(start, end),
            isCopied: copiedBatches.has(i)
        });
    }

    batchesArray.sort((a, b) => {
        if (a.isCopied === b.isCopied) return a.id - b.id;
        return a.isCopied ? 1 : -1;
    });

    batchesArray.forEach(batch => {
        const btn = document.createElement("button");
        btn.className = "batch-btn";
        
        if (batch.isCopied) {
            btn.classList.add("copied");
            btn.innerHTML = `<span>✅ الدفعة ${batch.id + 1} (تم النسخ)</span> <span>من ${batch.start+1} إلى ${batch.end}</span>`;
        } else {
            btn.innerHTML = `<span>📋 نسخ الدفعة ${batch.id + 1}</span> <span>من ${batch.start+1} إلى ${batch.end}</span>`;
            
            btn.addEventListener("click", async () => {
                let resultText = "";
                batch.numbers.forEach((num, index) => {
                    resultText += `${index + 1}. ${num}\n`;
                    if ((index + 1) % 5 === 0 && (index + 1) !== batch.numbers.length) {
                        resultText += "\n\n"; 
                    }
                });

                try {
                    await navigator.clipboard.writeText(resultText.trim());
                    copiedBatches.add(batch.id);
                    renderBatches();
                    saveToCloud(); // حفظ حالة النسخ للسيرفر عشان تتحدث عند الجميع
                } catch (err) {
                    alert("تعذر النسخ!");
                }
            });
        }
        batchContainer.appendChild(btn);
    });
}

function renderUI() {
    allBox.value = numbers.join("\n");
    countEl.textContent = numbers.length.toLocaleString("en-US");
    allCountEl.textContent = numbers.length.toLocaleString("en-US");
    renderBatches();
}

document.getElementById("add").addEventListener("click", () => {
    const list = parse(input.value);
    if (!list.length) { return; }

    const seen = new Set(numbers);
    let newCount = 0, dupCount = 0;
    let newNumbersToAdd = [];

    for (const n of list) {
      if (seen.has(n)) {
          dupCount++;
      } else { 
          seen.add(n); 
          newNumbersToAdd.push(n);
          newCount++; 
      }
    }

    newNumbersToAdd.reverse();
    numbers = [...newNumbersToAdd, ...numbers];

    input.value = "";
    renderUI();
    saveToCloud(); // حفظ للسيرفر
    
    addedEl.textContent = newCount;
    dupesEl.textContent = dupCount;
});

document.getElementById("clearInput").addEventListener("click", () => {
    input.value = ""; input.focus();
});

document.getElementById("save").addEventListener("click", () => {
    if (!numbers.length) return;
    const blob = new Blob(["\uFEFF" + numbers.join("\r\n") + "\r\n"], {type: "text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "كل_الأرقام.txt";
    document.body.appendChild(a); a.click(); a.remove();
});

document.getElementById("file").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const incoming = parse(text);
    const seen = new Set(numbers);
    let n = 0, d = 0;
    let newNumbersToAdd = [];

    for (const item of incoming) {
      if (seen.has(item)) {
          d++;
      } else { 
          seen.add(item); 
          newNumbersToAdd.push(item);
          n++; 
      }
    }
    
    newNumbersToAdd.reverse();
    numbers = [...newNumbersToAdd, ...numbers];
    
    renderUI();
    saveToCloud(); // حفظ للسيرفر
    
    addedEl.textContent = n;
    dupesEl.textContent = d;
    e.target.value = "";
});

document.getElementById("reset").addEventListener("click", () => {
    if (!numbers.length) return;
    if (!confirm("هل تريد مسح القائمة بالكامل للجميع؟")) return;
    numbers = []; copiedBatches.clear();
    addedEl.textContent = "0"; dupesEl.textContent = "0";
    renderUI();
    saveToCloud();
});

</script>
</body>
</html>
